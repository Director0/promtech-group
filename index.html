<!DOCTYPE html>
<html lang="ru" class="preload">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Промтех Групп. Инжиниринг и проектирование любой сложности. По всей России." />
  <meta name="theme-color" content="#000000" />
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg" />
  <meta property="og:title" content="Промтех Групп" />
  <meta property="og:description" content="Инжиниринг и проектирование любой сложности. По всей России." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="assets/projects/bof-eurasia/th.webp" />
  <title>Промтех Групп</title>

  <!-- Font: Manrope only (one typeface for the whole site) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="assets/css/styles.css?v=34" />
  <!-- keep hero hidden until intro plays, but only when JS is available -->
  <script>document.documentElement.classList.add("preload");</script>
</head>
<body>
  <a class="skip-link" href="#main">Перейти к содержанию</a>

  <!-- ================= NAV ================= -->
  <header class="nav" id="nav">
    <a class="nav-logo" id="nav-logo" href="#home" aria-label="Home"></a>
    <div class="nav-right">
      <nav class="nav-links" id="nav-links" aria-label="Primary"></nav>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle light/dark theme" title="Toggle theme">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.5 6.5 0 0 0 9.8 9.8Z"/></svg>
      </button>
      <button class="nav-toggle" id="nav-toggle" aria-label="Open menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <main id="main">

  <!-- ================= HERO ================= -->
  <section class="hero" id="home">
    <canvas id="scene-canvas" aria-hidden="true"></canvas>
    <div class="hero-scrim" aria-hidden="true"></div>
    <div class="hero-inner">
      <div class="container">
        <p class="hero-eyebrow" id="hero-eyebrow"></p>
        <h1 id="hero-title"></h1>
        <p class="hero-summary" id="hero-summary"></p>
        <div class="hero-actions" id="hero-actions"></div>
        <div class="hero-stats" id="hero-stats"></div>
      </div>
    </div>
    <!-- stages of the scene's cycle (lit by scene.js) -->
    <div class="hero-process" id="hero-process" aria-hidden="true"></div>
  </section>

  <!-- ================= MARQUEE (areas of work) ================= -->
  <div class="marquee" id="marquee" aria-label="Направления работ"></div>

  <!-- ================= ABOUT ================= -->
  <section class="section" id="about">
    <div class="container about-grid">
      <div class="about-copy">
        <p class="eyebrow" id="about-eyebrow" data-reveal></p>
        <h2 class="section-title" id="about-title" data-reveal data-reveal-delay="1"></h2>
        <div id="about-copy"></div>
      </div>
      <div class="about-media" data-reveal data-reveal-delay="1">
        <img id="about-image" alt="A Meridian Build project" loading="lazy" decoding="async" />
        <div class="about-badge" id="about-badge" hidden></div>
      </div>
    </div>
  </section>

  <!-- ================= TAGLINE (words light up on scroll) ================= -->
  <section class="section tagline" id="tagline" aria-label="Наш принцип">
    <div class="container">
      <p class="tagline-text" id="tagline-text"></p>
    </div>
  </section>

  <!-- ================= BENEFITS ================= -->
  <section class="section" id="benefits">
    <div class="container benefits-grid">
      <div class="benefits-head">
        <p class="eyebrow" id="benefits-eyebrow" data-reveal></p>
        <h2 class="section-title" id="benefits-title" data-reveal data-reveal-delay="1"></h2>
        <div class="benefits-proof" id="benefits-proof" data-reveal data-reveal-delay="2"></div>
      </div>
      <ol class="benefits-list" id="benefits-list"></ol>
    </div>
  </section>

  <!-- ================= PROCESS ================= -->
  <section class="section" id="process">
    <div class="container">
      <p class="eyebrow" id="process-eyebrow" data-reveal></p>
      <h2 class="section-title" id="process-title" data-reveal data-reveal-delay="1"></h2>
      <ol class="process-steps" id="process-steps"></ol>
    </div>
  </section>

  <!-- ================= PORTFOLIO ================= -->
  <section class="section portfolio" id="portfolio">
    <div class="container">
      <div class="portfolio-head">
        <div>
          <p class="eyebrow" id="portfolio-eyebrow" data-reveal></p>
          <h2 class="section-title" id="portfolio-title" data-reveal data-reveal-delay="1"></h2>
          <p class="lead" id="portfolio-subtitle" data-reveal data-reveal-delay="2"></p>
        </div>
      </div>
    </div>
    <!-- card deck: pinned while the fan of project cards turns with the scroll (fx.js) -->
    <div class="deck" id="deck">
      <div class="deck-stage">
        <div class="container deck-bar">
          <div class="filters" id="filters"></div>
          <p class="deck-count" aria-live="polite"><b id="deck-cur">01</b> / <span id="deck-total">01</span></p>
        </div>
        <div class="deck-fan" id="projects-grid"></div>
        <div class="container deck-foot">
          <button class="deck-nav" id="deck-prev" type="button" aria-label="Предыдущий проект">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <div class="deck-progress" aria-hidden="true"><span id="deck-bar"></span></div>
          <button class="deck-nav" id="deck-next" type="button" aria-label="Следующий проект">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 6l6 6-6 6"/></svg>
          </button>
          <p class="deck-hint" id="deck-hint">Листайте, чтобы перебрать колоду</p>
        </div>
      </div>
    </div>
  </section>

  <!-- ================= NEWS ================= -->
  <section class="section" id="news">
    <div class="container">
      <div class="news-head">
        <p class="eyebrow" id="news-eyebrow" data-reveal></p>
        <h2 class="section-title" id="news-title" data-reveal data-reveal-delay="1"></h2>
        <p class="lead" id="news-subtitle" data-reveal data-reveal-delay="2"></p>
      </div>
      <div class="news-grid" id="news-grid"></div>
    </div>
  </section>

  <!-- News modal (opens over a blurred page) -->
  <div class="news-modal" id="news-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="news-modal-title" data-lenis-prevent>
    <div class="news-modal-panel" role="document">
      <button class="news-modal-close" id="news-modal-close" aria-label="Закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div class="news-modal-media"><img id="news-modal-img" alt="" /></div>
      <div class="news-modal-body">
        <p class="news-modal-date" id="news-modal-date"></p>
        <h3 class="news-modal-title" id="news-modal-title"></h3>
        <div class="news-modal-text" id="news-modal-text"></div>
      </div>
    </div>
  </div>

  <!-- ================= FINAL CTA ================= -->
  <section class="final-cta" id="final-cta">
    <div class="final-cta-media" aria-hidden="true">
      <video id="final-cta-video" muted loop playsinline preload="none"></video>
    </div>
    <div class="container final-cta-inner">
      <p class="eyebrow" id="final-cta-eyebrow" data-reveal></p>
      <h2 class="final-cta-title" id="final-cta-title" data-reveal data-reveal-delay="1"></h2>
      <p class="lead" id="final-cta-text" data-reveal data-reveal-delay="2"></p>
      <div class="final-cta-actions" id="final-cta-actions" data-reveal data-reveal-delay="3"></div>
    </div>
  </section>

  <!-- ================= CONTACT ================= -->
  <section class="section" id="contact">
    <div class="container contact-grid">
      <div class="contact-info">
        <p class="eyebrow" id="contact-eyebrow" data-reveal></p>
        <h2 class="section-title" id="contact-title" data-reveal data-reveal-delay="1"></h2>
        <p id="contact-text" data-reveal data-reveal-delay="1"></p>
        <ul class="contact-list" id="contact-list" data-reveal data-reveal-delay="2"></ul>
      </div>
      <form class="form" id="contact-form" data-reveal data-reveal-delay="2" novalidate>
        <div class="field">
          <label for="f-name">Ваше имя</label>
          <input id="f-name" name="name" type="text" autocomplete="name" required aria-describedby="f-name-err" />
          <p class="field-error" id="f-name-err" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="f-email">Email</label>
          <input id="f-email" name="email" type="email" autocomplete="email" required aria-describedby="f-email-err" />
          <p class="field-error" id="f-email-err" aria-live="polite"></p>
        </div>
        <div class="field">
          <label for="f-msg">О проекте</label>
          <textarea id="f-msg" name="message" required placeholder="Site location, type of build, rough timeline…" aria-describedby="f-msg-err"></textarea>
          <p class="field-error" id="f-msg-err" aria-live="polite"></p>
        </div>
        <label class="field-consent" id="consent-field">
          <input type="checkbox" id="f-consent" name="consent" required />
          <span id="consent-text"></span>
        </label>
        <button class="btn btn-primary" type="submit" id="contact-submit" disabled>Отправить</button>
        <p class="form-note">Ответим на любые предложения в течение двух рабочих дней.</p>
      </form>
    </div>
  </section>

  </main>

  <!-- ================= FOOTER ================= -->
  <footer class="footer">
    <div class="container">
      <div class="footer-grid">
        <div class="footer-brand">
          <div class="footer-logo" id="footer-logo"></div>
          <p id="footer-blurb"></p>
        </div>
        <div class="footer-cols" id="footer-cols"></div>
      </div>
      <div class="footer-bottom">
        <span id="footer-copy"></span>
        <span><a href="privacy.html">Политика конфиденциальности</a></span>
        <span>Разработано: Stolpovsky corp. · Forward To Invent.</span>
      </div>
    </div>
  </footer>

  <!-- ================= SCRIPTS ================= -->
  <!-- 1) config + theme load first (plain scripts, set globals) -->
  <script src="assets/js/config.js?v=21"></script>
  <script src="assets/js/theme.js?v=6"></script>
  <script src="assets/js/placeholder.js?v=2"></script>
  <script src="assets/js/cursor.js?v=1"></script>
  <script src="assets/js/cookie.js?v=1"></script>
  <!-- 2) inertial scroll + shared effects (grain, spotlight, card stack, tagline) -->
  <script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
  <script src="assets/js/fx.js?v=2"></script>
  <!-- 3) Three.js module resolution for the 3D hero scene -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <!-- 4) page logic + 3D scene (ES modules, deferred automatically) -->
  <script type="module" src="assets/js/main.js?v=22"></script>
  <script type="module" src="assets/js/scene.js?v=12"></script>
</body>
</html>
